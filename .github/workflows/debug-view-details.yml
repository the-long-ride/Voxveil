name: Debug View Details

on:
  pull_request:
    branches: [feat/windows-apo-component]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.17.0'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Verify UI regression
        run: npm test --workspace @voxveil/ui -- HomeScreen.test.tsx
      - name: UI typecheck
        run: npm run typecheck --workspace @voxveil/ui
      - name: Verify APO package contract
        run: node --test scripts/ci/check-apo-package.test.mjs
      - name: Verify artifact collector
        run: node --test scripts/release/collect-artifacts.test.mjs
      - name: Parse installer scripts
        shell: pwsh
        run: |
          foreach ($script in @('native/windows/apo/install.ps1', 'native/windows/apo/uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell parser errors in $script"
            }
          }
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust APO and Tauri tests
        run: cargo test -p voxveil-windows-audio -p voxveil-tauri
      - name: Locate Visual Studio build tools
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -requires Microsoft.Component.MSBuild -property installationPath
          $path = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $installation -or -not $path) { throw 'Visual Studio build tools were not found' }
          "path=$path" >> $env:GITHUB_OUTPUT
          "installation=$installation" >> $env:GITHUB_OUTPUT
      - name: Build native DSP tests
        shell: pwsh
        run: |
          & '${{ steps.msbuild.outputs.path }}' native/windows/apo/VoxveilApoTests.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native DSP tests
        shell: pwsh
        run: native/windows/apo/out/Release/VoxveilApoTests.exe
      - name: Build endpoint APO and activation checker
        shell: pwsh
        run: |
          & '${{ steps.msbuild.outputs.path }}' native/windows/apo/VoxveilApo.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '${{ steps.msbuild.outputs.path }}' native/windows/apo/VoxveilApoCheck.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify self-contained APO COM server
        shell: pwsh
        run: |
          $dll = (Resolve-Path 'native/windows/apo/out/Release/VoxveilApo.dll').Path
          $checker = (Resolve-Path 'native/windows/apo/out/Release/VoxveilApoCheck.exe').Path
          $dumpbin = Get-ChildItem -Path '${{ steps.msbuild.outputs.installation }}\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found' }
          foreach ($binary in @($dll, $checker)) {
            $dependencies = (& $dumpbin.FullName /DEPENDENTS $binary | Out-String)
            if ($dependencies -match '(?im)\b(?:MSVCP|VCRUNTIME)\d+(?:_\d+)?\.dll\b') {
              throw "$binary still depends on the Visual C++ Redistributable"
            }
          }
          & $checker $dll
          if ($LASTEXITCODE -ne 0) { throw "Native APO activation checker failed with exit code $LASTEXITCODE" }
      - name: Build standalone Windows pro-system application
        env:
          VOXVEIL_EDITION: pro-system
        run: npm run tauri --workspace @voxveil/tauri-shell -- build --no-bundle --config tauri.windows.conf.json
      - name: Verify standalone executable embeds system audio payload
        shell: pwsh
        run: |
          $exe = 'target/release/voxveil.exe'
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Missing $exe" }
          & $exe --verify-embedded-system-audio
          if ($LASTEXITCODE -ne 0) { throw "Embedded system-audio verification failed with exit code $LASTEXITCODE" }
      - name: Collect standalone artifact
        run: node scripts/release/collect-artifacts.mjs --platform windows --edition pro-system
      - name: Upload standalone Windows executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Voxveil-windows-view-details-fix
          path: dist-artifacts/windows-pro-system/
          if-no-files-found: error
          retention-days: 14
