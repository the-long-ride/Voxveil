name: Manual Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, commit, or tag to build
        required: true
        default: master
        type: string
      platform:
        description: Platform
        required: true
        default: all
        type: choice
        options: [all, windows, linux, macos, android, ios]
      edition:
        description: Edition
        required: true
        default: all
        type: choice
        options: [all, standard, pro-system]

permissions:
  contents: read

jobs:
  preflight:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      build_matrix: ${{ steps.build_matrix.outputs.matrix }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
      - name: Resolve selected build matrix
        id: build_matrix
        shell: bash
        env:
          SELECTED_PLATFORM: ${{ inputs.platform }}
          SELECTED_EDITION: ${{ inputs.edition }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const platformRunners = {
            windows: 'windows-latest',
            linux: 'ubuntu-24.04',
            macos: 'macos-15',
            android: 'ubuntu-24.04',
            ios: 'macos-15',
          };
          const editions = ['standard', 'pro-system'];

          const selectedPlatform = process.env.SELECTED_PLATFORM;
          const selectedEdition = process.env.SELECTED_EDITION;

          if (selectedPlatform !== 'all' && !(selectedPlatform in platformRunners)) {
            throw new Error(`Unsupported platform: ${selectedPlatform}`);
          }
          if (selectedEdition !== 'all' && !editions.includes(selectedEdition)) {
            throw new Error(`Unsupported edition: ${selectedEdition}`);
          }

          const platforms =
            selectedPlatform === 'all' ? Object.keys(platformRunners) : [selectedPlatform];
          const selectedEditions =
            selectedEdition === 'all' ? editions : [selectedEdition];

          const include = platforms.flatMap((platform) =>
            selectedEditions.map((edition) => ({
              platform,
              edition,
              os: platformRunners[platform],
            })),
          );

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          NODE
      - name: Require committed lockfiles
        run: node scripts/ci/require-lockfiles.mjs
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Verify Windows APO package contract
        if: inputs.platform == 'windows' && (inputs.edition == 'pro-system' || inputs.edition == 'all')
        run: node --test scripts/ci/check-apo-package.test.mjs scripts/release/collect-artifacts.test.mjs
      - name: Run source quality gates
        run: npm run quality
      - name: Run UI coverage gate
        run: npm run coverage
      - name: Install Linux Tauri system packages
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain && rustup component add rustfmt clippy llvm-tools-preview
      - name: Install pinned Rust quality tools
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-llvm-cov --version 0.8.7
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Rust dependency policy
        run: cargo deny check
      - name: Rust tests and 85% line coverage gate
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 85

  build:
    name: ${{ matrix.platform }} / ${{ matrix.edition }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
      - name: Install Linux Tauri system packages
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Require committed lockfiles
        run: node scripts/ci/require-lockfiles.mjs
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Locate MSBuild for Windows APO
        if: matrix.platform == 'windows' && matrix.edition == 'pro-system'
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $path) { throw 'MSBuild was not found' }
          "path=$path" >> $env:GITHUB_OUTPUT
      - name: Build and test Windows APO
        if: matrix.platform == 'windows' && matrix.edition == 'pro-system'
        shell: pwsh
        run: |
          & '${{ steps.msbuild.outputs.path }}' native/windows/apo/VoxveilApoTests.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & native/windows/apo/out/Release/VoxveilApoTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '${{ steps.msbuild.outputs.path }}' native/windows/apo/VoxveilApo.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage Windows system-audio component
        if: matrix.platform == 'windows' && matrix.edition == 'pro-system'
        shell: pwsh
        run: |
          $target = 'target/system-audio'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item 'native/windows/apo/out/Release/VoxveilApo.dll' "$target/VoxveilApo.dll" -Force
          Copy-Item 'native/windows/apo/install.ps1' "$target/install.ps1" -Force
          Copy-Item 'native/windows/apo/uninstall.ps1' "$target/uninstall.ps1" -Force
          Copy-Item 'native/windows/apo/README.txt' "$target/README.txt" -Force
      - name: Build Windows pro-system portable application
        if: matrix.platform == 'windows' && matrix.edition == 'pro-system'
        env:
          VOXVEIL_EDITION: pro-system
        run: npm run tauri --workspace @voxveil/tauri-shell -- build --no-bundle --config tauri.windows.conf.json
      - name: Build selected variant
        if: matrix.platform != 'windows' || matrix.edition != 'pro-system'
        env:
          VOXVEIL_EDITION: ${{ matrix.edition }}
        run: node scripts/build/build-variant.mjs --platform ${{ matrix.platform }} --edition ${{ matrix.edition }}
      - name: Verify Windows portable executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $binary = 'target/release/voxveil.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Expected portable Windows binary was not produced: $binary"
          }
          Get-Item -LiteralPath $binary | Format-List FullName, Length, LastWriteTime
      - name: Verify Windows APO package
        if: matrix.platform == 'windows' && matrix.edition == 'pro-system'
        shell: pwsh
        run: |
          foreach ($file in @('target/system-audio/VoxveilApo.dll', 'target/system-audio/install.ps1', 'target/system-audio/uninstall.ps1', 'target/system-audio/README.txt')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Expected system-audio file was not produced: $file" }
          }
      - name: Collect and checksum packages and portable binary
        run: node scripts/release/collect-artifacts.mjs --platform ${{ matrix.platform }} --edition ${{ matrix.edition }}
      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Voxveil-${{ matrix.platform }}-${{ matrix.edition }}
          path: dist-artifacts/${{ matrix.platform }}-${{ matrix.edition }}/
          if-no-files-found: error
          retention-days: 14
