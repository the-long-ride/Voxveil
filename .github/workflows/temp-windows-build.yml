name: Temporary Windows APO Binary

on:
  pull_request:
    branches:
      - fix/windows-componentized-apo

permissions:
  contents: read

concurrency:
  group: temp-windows-apo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: npm

      - name: Show toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      - name: Build Windows package
        shell: pwsh
        run: .\scripts\windows\build-windows.ps1 -SkipTests

      - name: Upload binary package
        uses: actions/upload-artifact@v4
        with:
          name: Voxveil-windows-x64-apo
          path: dist/windows-x64/Voxveil/
          if-no-files-found: error
          compression-level: 0
