name: One-shot Auto Endpoint Validation

# phase: ui-green-ubuntu
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/maintenance-auto-endpoint-once.yml'

permissions:
  contents: read

jobs:
  ui-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: npm
      - name: Validate workflow-free checkout tree
        shell: bash
        run: rm -rf .github/workflows
      - name: Install Node dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Playback endpoint UI tests
        shell: bash
        run: npm run test --workspace @voxveil/ui
      - name: Typecheck
        shell: bash
        run: npm run typecheck
      - name: Quality endpoint contract
        shell: bash
        run: npm run test:quality
