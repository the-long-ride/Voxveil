name: One-shot Auto Endpoint Validation

# phase: ui-red
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/maintenance-auto-endpoint-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: npm
      - name: Validate workflow-free checkout tree
        shell: pwsh
        run: Remove-Item .github/workflows -Recurse -Force
      - name: Install Node dependencies
        shell: pwsh
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Playback endpoint UI tests
        shell: pwsh
        run: npm run test --workspace @voxveil/ui
