name: One-shot Master Cleanup and Windows Build

# retry: official APO link libraries
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/maintenance-windows-build-once.yml'

permissions:
  contents: write

jobs:
  cleanup-and-build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout exact master commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Delete redundant remote branches
        shell: pwsh
        run: |
          git fetch --prune origin
          $branches = git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin |
            Where-Object { $_ -and $_ -ne 'HEAD' -and $_ -ne 'master' }
          Write-Host "Deleting $($branches.Count) non-master branches..."
          foreach ($branch in $branches) {
            Write-Host "Deleting origin/$branch"
            git push origin --delete $branch
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete branch: $branch" }
          }

      - name: Remove one-shot workflow from build tree
        shell: pwsh
        run: Remove-Item .github/workflows -Recurse -Force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: npm

      - name: Show Windows build toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      - name: Full manual Windows build
        shell: pwsh
        run: .\scripts\windows\build-windows.ps1

      - name: Smoke-test Windows outputs
        shell: pwsh
        run: |
          $package = (Resolve-Path 'dist/windows-x64/Voxveil').Path
          $control = Join-Path $package 'system-audio\voxveil-control.exe'
          $app = Join-Path $package 'voxveil.exe'
          $apo = Join-Path $package 'system-audio\VoxveilApo.dll'
          $controlDll = Join-Path $package 'system-audio\VoxveilControl.dll'

          foreach ($required in @($control, $app, $apo, $controlDll)) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "Missing build output: $required" }
          }

          & $control status
          if ($LASTEXITCODE -ne 0) { throw "voxveil-control status failed: $LASTEXITCODE" }

          $process = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            if ($process.ExitCode -ne 0) { throw "voxveil.exe exited with code $($process.ExitCode)" }
            Write-Host 'voxveil.exe exited cleanly during smoke test.'
          } else {
            Write-Host "voxveil.exe launched successfully (PID $($process.Id))."
            Stop-Process -Id $process.Id -Force
          }

          Get-Content (Join-Path $package 'SHA256SUMS.txt')

      - name: Upload Windows binary package
        uses: actions/upload-artifact@v4
        with:
          name: Voxveil-windows-x64-master
          path: dist/windows-x64/Voxveil/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
