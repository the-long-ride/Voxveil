name: One-shot System Audio Install Button Check

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/maintenance-install-button-once.yml'

permissions:
  contents: read

jobs:
  red-green:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: npm
      - name: Test final workflow-free tree
        shell: pwsh
        run: |
          Remove-Item .github/workflows -Recurse -Force
          npm ci
          npm run test:quality
