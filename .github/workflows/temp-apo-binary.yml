name: Temporary APO Binary Build

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-componentized-apo

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: npm

      - name: Show toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      - name: Build Windows package
        shell: pwsh
        run: .\scripts\windows\build-windows.ps1 -SkipTests

      - name: Upload binary package
        uses: actions/upload-artifact@v4
        with:
          name: Voxveil-windows-x64-componentized-apo
          path: dist/windows-x64/Voxveil/
          if-no-files-found: error
          compression-level: 0
