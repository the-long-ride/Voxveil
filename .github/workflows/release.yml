name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag and quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate strict semantic tag
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "if (!/^v\\d+\\.\\d+\\.\\d+$/.test(process.env.TAG)) process.exit(1)"
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
      - name: Verify tag matches project manifests
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release/verify-version.mjs "$TAG"
      - name: Require committed lockfiles
        run: node scripts/ci/require-lockfiles.mjs
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Run source gates and UI coverage
        run: npm run quality && npm run coverage
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Install Linux Tauri system packages
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain && rustup component add rustfmt clippy llvm-tools-preview
      - name: Install pinned Rust quality tools
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-llvm-cov --version 0.8.7
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Rust dependency policy
        run: cargo deny check
      - name: Rust tests and 85% line coverage gate
        run: cargo llvm-cov --workspace --all-features --fail-under-lines 85
      - name: Generate release SBOM and dependency metadata
        run: node scripts/release/generate-release-metadata.mjs
      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Voxveil-release-metadata
          path: release-metadata/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.platform }} / ${{ matrix.edition }}
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, edition: standard, os: windows-latest }
          - { platform: windows, edition: pro-system, os: windows-latest }
          - { platform: linux, edition: standard, os: ubuntu-24.04 }
          - { platform: linux, edition: pro-system, os: ubuntu-24.04 }
          - { platform: macos, edition: standard, os: macos-15 }
          - { platform: macos, edition: pro-system, os: macos-15 }
          - { platform: android, edition: standard, os: ubuntu-24.04 }
          - { platform: android, edition: pro-system, os: ubuntu-24.04 }
          - { platform: ios, edition: standard, os: macos-15 }
          - { platform: ios, edition: pro-system, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
      - name: Install Linux Tauri system packages
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Require committed lockfiles
        run: node scripts/ci/require-lockfiles.mjs
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Build variant
        env:
          VOXVEIL_EDITION: ${{ matrix.edition }}
        run: node scripts/build/build-variant.mjs --platform ${{ matrix.platform }} --edition ${{ matrix.edition }}
      - name: Collect package and checksums
        run: node scripts/release/collect-artifacts.mjs --platform ${{ matrix.platform }} --edition ${{ matrix.edition }}
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Voxveil-${{ matrix.platform }}-${{ matrix.edition }}
          path: dist-artifacts/${{ matrix.platform }}-${{ matrix.edition }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --dir release-artifacts
      - name: Prepare globally unique release asset names
        run: node scripts/release/prepare-release-assets.mjs release-artifacts release-assets
      - name: Create release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/* --verify-tag --generate-notes --title "Voxveil $TAG"
