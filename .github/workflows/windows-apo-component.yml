name: Windows APO Component

on:
  push:
    branches: [feat/windows-apo-component]
  pull_request:
    branches: [feat/windows-apo-component]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Verify APO package contract
        run: node --test scripts/ci/check-apo-package.test.mjs
      - name: Parse installer scripts
        shell: pwsh
        run: |
          foreach ($script in @('native/windows/apo/install.ps1', 'native/windows/apo/uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell parser errors in $script"
            }
          }
      - name: UI tests
        run: npm test --workspace @voxveil/ui
      - name: UI typecheck
        run: npm run typecheck --workspace @voxveil/ui
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust APO and Tauri tests
        run: cargo test -p voxveil-windows-audio -p voxveil-tauri
      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $path) { throw 'MSBuild was not found' }
          "path=$path" >> $env:GITHUB_OUTPUT
      - name: Build native DSP tests
        shell: pwsh
        run: |
          & '${{ steps.msbuild.outputs.path }}' native/windows/apo/VoxveilApoTests.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native DSP tests
        shell: pwsh
        run: native/windows/apo/out/Release/VoxveilApoTests.exe
      - name: Build endpoint APO
        shell: pwsh
        run: |
          & '${{ steps.msbuild.outputs.path }}' native/windows/apo/VoxveilApo.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify APO DLL
        shell: pwsh
        run: |
          $dll = 'native/windows/apo/out/Release/VoxveilApo.dll'
          if (-not (Test-Path $dll -PathType Leaf)) { throw "Missing $dll" }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime
