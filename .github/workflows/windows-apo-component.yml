name: Windows APO Component

on:
  push:
    branches: [feat/windows-apo-component]
  pull_request:
    branches: [feat/windows-apo-component]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.17.0'
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Verify APO package contract
        run: node --test scripts/ci/check-apo-package.test.mjs
      - name: Verify artifact collector
        run: node --test scripts/release/collect-artifacts.test.mjs
      - name: Parse installer scripts
        shell: pwsh
        run: |
          foreach ($script in @('native/windows/apo/install.ps1', 'native/windows/apo/uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "PowerShell parser errors in $script"
            }
          }
      - name: UI tests
        run: npm test --workspace @voxveil/ui
      - name: UI typecheck
        run: npm run typecheck --workspace @voxveil/ui
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust APO and Tauri tests
        run: cargo test -p voxveil-windows-audio -p voxveil-tauri
      - name: Locate Visual Studio build tools
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -requires Microsoft.Component.MSBuild -property installationPath
          $path = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $installation -or -not $path) { throw 'Visual Studio build tools were not found' }
          "path=$path" >> $env:GITHUB_OUTPUT
          "installation=$installation" >> $env:GITHUB_OUTPUT
      - name: Build native DSP tests
        shell: pwsh
        run: |
          & '${{ steps.msbuild.outputs.path }}' native/windows/apo/VoxveilApoTests.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native DSP tests
        shell: pwsh
        run: native/windows/apo/out/Release/VoxveilApoTests.exe
      - name: Build endpoint APO
        shell: pwsh
        run: |
          & '${{ steps.msbuild.outputs.path }}' native/windows/apo/VoxveilApo.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify self-contained APO COM server
        shell: pwsh
        run: |
          $dll = (Resolve-Path 'native/windows/apo/out/Release/VoxveilApo.dll').Path
          $dumpbin = Get-ChildItem -Path '${{ steps.msbuild.outputs.installation }}\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found' }
          $dependencies = (& $dumpbin.FullName /DEPENDENTS $dll | Out-String)
          Write-Host $dependencies
          if ($dependencies -match '(?im)\b(?:MSVCP|VCRUNTIME)\d+(?:_\d+)?\.dll\b') {
            throw 'VoxveilApo.dll still depends on the Visual C++ Redistributable'
          }

          $clsid = '{7E268E67-2F3C-4F0A-A09C-8B7D27B43F51}'
          $root = "HKCU:\Software\Classes\CLSID\$clsid"
          $inproc = Join-Path $root 'InprocServer32'
          try {
            New-Item -Path $inproc -Force | Out-Null
            Set-Item -Path $inproc -Value $dll
            New-ItemProperty -Path $inproc -Name ThreadingModel -PropertyType String -Value Both -Force | Out-Null
            $type = [Type]::GetTypeFromCLSID([Guid]$clsid)
            if ($null -eq $type) { throw 'APO COM type could not be resolved' }
            $instance = [Activator]::CreateInstance($type)
            if ($null -eq $instance) { throw 'APO COM server returned no object' }
            if ([Runtime.InteropServices.Marshal]::IsComObject($instance)) {
              [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($instance)
            }
          } finally {
            Remove-Item -Path $root -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Stage system-audio package
        shell: pwsh
        run: |
          $target = 'target/system-audio'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item 'native/windows/apo/out/Release/VoxveilApo.dll' "$target/VoxveilApo.dll" -Force
          Copy-Item 'native/windows/apo/install.ps1' "$target/install.ps1" -Force
          Copy-Item 'native/windows/apo/uninstall.ps1' "$target/uninstall.ps1" -Force
          Copy-Item 'native/windows/apo/README.txt' "$target/README.txt" -Force
      - name: Build portable Windows pro-system application
        env:
          VOXVEIL_EDITION: pro-system
        run: npm run tauri --workspace @voxveil/tauri-shell -- build --no-bundle --config tauri.windows.conf.json
      - name: Verify Windows binaries
        shell: pwsh
        run: |
          foreach ($file in @('target/release/voxveil.exe', 'target/system-audio/VoxveilApo.dll')) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing $file" }
            Get-Item $file | Format-List FullName,Length,LastWriteTime
          }
      - name: Collect pro-system artifact
        run: node scripts/release/collect-artifacts.mjs --platform windows --edition pro-system
      - name: Upload Windows pro-system artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Voxveil-windows-pro-system-apo
          path: dist-artifacts/windows-pro-system/
          if-no-files-found: error
          retention-days: 14
