[package]
name = "voxveil-ai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
voxveil-model-api = { path = "../voxveil-model-api" }
voxveil-media = { path = "../voxveil-media" }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "load-dynamic", "ndarray"] }
rubato = "=0.16.2"
rustfft = "=6.4.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
hound = "=3.5.1"
